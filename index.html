<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>باشگاه ساحل — تنیس و پدل‌بورد</title>
<script>(function(){try{var site=/[?&]site=1/.test(location.search);if(site){sessionStorage.setItem('sahel-site','1');}var forced=site||sessionStorage.getItem('sahel-site')==='1';var ua=navigator.userAgent||'';var phone=/Android.+Mobile|iPhone|iPod|Windows Phone|IEMobile|Opera Mini/i.test(ua)||!!(navigator.userAgentData&&navigator.userAgentData.mobile);var small=Math.min(screen.width,screen.height)<=600;var coarse=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);if(!forced&&(phone||(coarse&&small))){location.replace('app/home.html'+location.hash);}}catch(e){}})();</script>
<meta name="description" content="باشگاه تنیس و پدل‌بورد ساحل — رزرو آنلاین زمین تنیس و سانس‌های پدل‌بورد.">
<meta name="theme-color" content="#0B5D74">
<meta property="og:title" content="باشگاه ساحل — تنیس و پدل‌بورد">
<meta property="og:description" content="باشگاه تنیس و پدل‌بورد ساحل — رزرو آنلاین زمین تنیس و سانس‌های پدل‌بورد.">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/vazirmatn-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/base.css?v=3">
</head>
<body>
<template id="dc-template">
<helmet>
<style>
body{margin:0;background:#FFFFFF}
a{color:#0B5D74}a:hover{color:#084A5D}
.s-btn{transition:transform .18s ease, box-shadow .18s ease, background-color .18s ease}
.s-btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px -14px rgba(11,93,116,.55)}
.s-card{transition:transform .25s ease, box-shadow .25s ease}
.s-card:hover{transform:translateY(-4px);box-shadow:0 30px 60px -30px rgba(15,30,38,.35)}
.s-zoom img{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.s-zoom:hover img{transform:scale(1.05)}
.s-link{transition:color .15s ease}
.s-link:hover{color:#0F1E26}
.s-cell{transition:background-color .12s ease, color .12s ease, box-shadow .12s ease}
.s-cell:not([disabled]):hover{box-shadow:inset 0 0 0 2px #0B5D74}
:focus-visible{outline:3px solid #12A4A0;outline-offset:2px}
@media (max-width: 960px){
.s-hero{grid-template-columns:minmax(0,1fr) !important}
.s-hero-media{height:520px !important}
.s-nav-links{display:none !important}
.s-two{grid-template-columns:minmax(0,1fr) !important}
.s-fac{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
.s-fac > *{grid-column:span 1 !important;grid-row:span 1 !important}
.s-exp{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
}
@media (max-width: 600px){
.s-fac{grid-template-columns:minmax(0,1fr) !important}
.s-exp{grid-template-columns:minmax(0,1fr) !important}
.s-hero-media{height:420px !important}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</helmet>
<div dir="rtl" style="width: 100%; background: #FFFFFF; color: #0F1E26; font-family: 'Vazirmatn', system-ui, sans-serif; overflow-x: hidden">

<header style="position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid #E8EEF0">
<div style="max-width: 1320px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); height: 78px; display: flex; align-items: center; justify-content: space-between; gap: 24px">
<a href="#top" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #0F1E26">
<svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="{{brand}}"></circle><path d="M5 23c4-3 7-3 10 0s7 3 10 0 7-3 10 0" stroke="#D9F25E" stroke-width="2.6" stroke-linecap="round"></path><path d="M11 14c3-2.2 6-2.2 9 0s6 2.2 9 0" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.9"></path></svg>
<span style="display: flex; flex-direction: column; line-height: 1.15">
<span style="font-size: 22px; font-weight: 900">ساحل</span>
<span style="font-size: 11px; font-weight: 600; color: #66757E; letter-spacing: 0.02em">باشگاه تنیس و پدل‌بورد</span>
</span>
</a>
<nav class="s-nav-links" aria-label="منوی اصلی" style="display: flex; gap: 30px; font-size: 15px; font-weight: 600">
<a class="s-link" href="#tennis" style="color: #44535C; text-decoration: none">تنیس</a>
<a class="s-link" href="#sup" style="color: #44535C; text-decoration: none">پدل‌بورد</a>
<a class="s-link" href="#facilities" style="color: #44535C; text-decoration: none">امکانات</a>
<a class="s-link" href="#membership" style="color: #44535C; text-decoration: none">عضویت</a>
<a class="s-link" href="#app" style="color: #44535C; text-decoration: none">اپلیکیشن</a>
</nav>
<div style="display: flex; align-items: center; gap: 10px">
<a class="s-link" href="#app" style="color: #0F1E26; text-decoration: none; font-size: 15px; font-weight: 600; padding: 12px 10px">ورود</a>
<a class="s-btn" href="#booking" style="display: inline-flex; align-items: center; gap: 8px; background: {{brand}}; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 15px; padding: 0 22px; height: 48px; border-radius: 999px">رزرو آنلاین</a>
</div>
</div>
</header>

<section id="top" style="max-width: 1320px; margin: 0 auto; padding: 56px clamp(16px, 4vw, 40px) 40px">
<div class="s-hero" style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 48px; align-items: center">
<div style="display: flex; flex-direction: column; gap: 28px">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; background: #E6F6F5; color: #0B6E6B; font-size: 14px; font-weight: 700; padding: 8px 16px; border-radius: 999px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #12A4A0"></span>تنیس روی زمین، پدل‌بورد روی آب</span>
<h1 style="margin: 0; font-size: clamp(44px, 5.6vw, 82px); font-weight: 900; line-height: 1.12; letter-spacing: -0.01em">یک باشگاه،<br><span style="color: {{brand}}">دو حس متفاوت.</span></h1>
<p style="margin: 0; max-width: 520px; font-size: 18px; line-height: 1.95; color: #44535C">صبح با پارو روی آب آرام، عصر با راکت روی زمین رسی. سانس خالی را آنلاین ببینید، انتخاب کنید و در کمتر از یک دقیقه رزرو کنید.</p>

<div style="background: #FFFFFF; border: 1px solid #E3E9EC; border-radius: 24px; box-shadow: 0 30px 60px -30px rgba(15,30,38,0.28); padding: 10px; max-width: 600px">
<div role="tablist" aria-label="انتخاب ورزش" style="display: flex; gap: 6px; padding: 4px; background: #F2F5F6; border-radius: 16px; margin-bottom: 10px">
<button type="button" role="tab" onClick="{{setTennis}}" aria-selected="{{isTennis}}" style="{{tabTennis}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M5.6 5.6c3.5 3.5 3.5 9.3 0 12.8M18.4 5.6c-3.5 3.5-3.5 9.3 0 12.8"></path></svg>تنیس</button>
<button type="button" role="tab" onClick="{{setSup}}" aria-selected="{{isSup}}" style="{{tabSup}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 17c2-1.5 4-1.5 6 0s4 1.5 6 0 4-1.5 6 0"></path><path d="M14 3l-4 11"></path><path d="M9 13l2 1-1 3-2-1z"></path></svg>پدل‌بورد</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px; align-items: stretch">
<button type="button" style="text-align: right; background: #FFFFFF; border: 0; border-radius: 14px; padding: 10px 14px; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #66757E; font-weight: 600">تاریخ</span><span style="font-size: 15px; font-weight: 800; color: #0F1E26">امروز، ۱۰ مهر</span></button>
<button type="button" style="text-align: right; background: #FFFFFF; border: 0; border-right: 1px solid #E3E9EC; border-radius: 0; padding: 10px 14px; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #66757E; font-weight: 600">{{f2Label}}</span><span style="font-size: 15px; font-weight: 800; color: #0F1E26">{{f2Val}}</span></button>
<button type="button" style="text-align: right; background: #FFFFFF; border: 0; border-right: 1px solid #E3E9EC; border-radius: 0; padding: 10px 14px; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #66757E; font-weight: 600">{{f3Label}}</span><span style="font-size: 15px; font-weight: 800; color: #0F1E26">{{f3Val}}</span></button>
<a class="s-btn" href="#booking" style="display: flex; align-items: center; justify-content: center; gap: 8px; background: {{brand}}; color: #FFFFFF; text-decoration: none; font-weight: 800; font-size: 15px; border-radius: 16px; min-height: 60px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>جستجو</a>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 22px; font-size: 14px; color: #44535C; font-weight: 600">
<span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#12A4A0" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 12l5 5L20 6"></path></svg>تأیید آنی</span>
<span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#12A4A0" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 12l5 5L20 6"></path></svg>پرداخت آنلاین امن</span>
<span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#12A4A0" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 12l5 5L20 6"></path></svg>تجهیزات و جلیقه‌ی نجات</span>
</div>
</div>

<div class="s-hero-media" style="position: relative; height: 640px; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); gap: 14px">
<div class="s-zoom" style="position: relative; grid-row: span 2; border-radius: 32px; overflow: hidden; background: #DDEFEF">
<img src="assets/img/sup-aerial-solo.webp" alt="پدل‌بورد سوار روی آب فیروزه‌ای از نمای بالا" style="width: 100%; height: 100%; object-fit: cover; display: block">
<span style="position: absolute; top: 18px; right: 18px; display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.92); color: #0B6E6B; font-size: 13px; font-weight: 800; padding: 8px 14px; border-radius: 999px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #12A4A0"></span>پدل‌بورد</span>
<div style="position: absolute; right: 18px; left: 18px; bottom: 18px; background: rgba(255,255,255,0.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 20px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #66757E; font-weight: 600">تور غروب امروز</span><span style="font-size: 16px; font-weight: 800">۱۸:۰۰ · {{supLeft}} برد خالی</span></span>
<a class="s-btn" href="#booking" onClick="{{setSup}}" style="background: #12A4A0; color: #FFFFFF; text-decoration: none; font-size: 13px; font-weight: 800; padding: 10px 16px; border-radius: 999px">رزرو</a>
</div>
</div>
<div class="s-zoom" style="position: relative; border-radius: 32px; overflow: hidden; background: #F3E6DE">
<img src="assets/img/clay-aerial-serve.webp" alt="بازیکن تنیس در حال سرویس روی زمین رسی از نمای بالا" style="width: 100%; height: 100%; object-fit: cover; display: block">
<span style="position: absolute; top: 16px; right: 16px; display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.92); color: #B94A17; font-size: 13px; font-weight: 800; padding: 8px 14px; border-radius: 999px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #E06A35"></span>تنیس</span>
</div>
<div class="s-zoom" style="position: relative; border-radius: 32px; overflow: hidden; background: #E8F0E8">
<img src="assets/img/ten-coach.webp" alt="مربی تنیس در حال آموزش کنار تور" style="width: 100%; height: 100%; object-fit: cover; display: block">
<span style="position: absolute; bottom: 16px; right: 16px; background: #D9F25E; color: #0F1E26; font-size: 13px; font-weight: 800; padding: 8px 14px; border-radius: 999px">کلاس با مربی</span>
</div>
</div>
</div>
</section>

<section style="max-width: 1320px; margin: 0 auto; padding: 24px clamp(16px, 4vw, 40px) 40px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px">
<div style="display: flex; gap: 14px; align-items: flex-start; padding: 22px; border-radius: 20px; background: #F4F7F7">
<span style="flex: 0 0 auto; width: 46px; height: 46px; border-radius: 14px; background: #FFFFFF; color: {{brand}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px; font-weight: 800">رزرو در چند ثانیه</span><span style="font-size: 14px; color: #5B6A73; line-height: 1.8">سانس‌های خالی را زنده ببینید.</span></span>
</div>
<div style="display: flex; gap: 14px; align-items: flex-start; padding: 22px; border-radius: 20px; background: #F4F7F7">
<span style="flex: 0 0 auto; width: 46px; height: 46px; border-radius: 14px; background: #FFFFFF; color: {{brand}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="7" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px; font-weight: 800">مربی‌های حرفه‌ای</span><span style="font-size: 14px; color: #5B6A73; line-height: 1.8">از جلسه‌ی اول تا مسابقه.</span></span>
</div>
<div style="display: flex; gap: 14px; align-items: flex-start; padding: 22px; border-radius: 20px; background: #F4F7F7">
<span style="flex: 0 0 auto; width: 46px; height: 46px; border-radius: 14px; background: #FFFFFF; color: {{brand}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px; font-weight: 800">ایمنی کامل روی آب</span><span style="font-size: 14px; color: #5B6A73; line-height: 1.8">جلیقه‌ی نجات و ناجی همراه.</span></span>
</div>
<div style="display: flex; gap: 14px; align-items: flex-start; padding: 22px; border-radius: 20px; background: #F4F7F7">
<span style="flex: 0 0 auto; width: 46px; height: 46px; border-radius: 14px; background: #FFFFFF; color: {{brand}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M3 10h18M7 15h4"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px; font-weight: 800">پرداخت و لغو آنلاین</span><span style="font-size: 14px; color: #5B6A73; line-height: 1.8">لغو رایگان تا [مهلت لغو] قبل.</span></span>
</div>
</div>
</section>

<section id="sup" style="background: #EAF7F6; margin-top: 60px">
<div style="max-width: 1320px; margin: 0 auto; padding: 110px clamp(16px, 4vw, 40px)">
<div class="s-two" style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; align-items: center; margin-bottom: 64px">
<div style="display: flex; flex-direction: column; gap: 22px">
<span style="align-self: flex-start; background: #FFFFFF; color: #0B6E6B; font-size: 13px; font-weight: 800; padding: 8px 16px; border-radius: 999px">پدل‌بورد · Stand Up Paddle</span>
<h2 style="margin: 0; font-size: clamp(36px, 4.4vw, 60px); font-weight: 900; line-height: 1.2">ایستاده روی آب،<br><span style="color: #0B7F7B">آرام و رها.</span></h2>
<p style="margin: 0; font-size: 17px; line-height: 2; color: #3E5560; max-width: 540px">پدل‌بورد یعنی ایستادن روی یک تخته‌ی بلند و پیش رفتن با یک پاروی ساده. یاد گرفتنش آسان است؛ تعادل، عضلات مرکزی بدن و تمرکز را تقویت می‌کند و تماشای آب از روی برد، تجربه‌ای است که فراموش نمی‌شود. برای شروع به هیچ تجربه‌ای نیاز ندارید.</p>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; max-width: 540px">
<div style="background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #5B6A73; font-weight: 600">سطح</span><span style="font-size: 16px; font-weight: 800">همه‌ی سطوح</span></div>
<div style="background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #5B6A73; font-weight: 600">حداقل سن</span><span style="font-size: 16px; font-weight: 800">[سن] سال</span></div>
<div style="background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #5B6A73; font-weight: 600">مدت سانس</span><span style="font-size: 16px; font-weight: 800">۹۰ دقیقه</span></div>
</div>
</div>
<div style="position: relative; height: 520px">
<div class="s-zoom" style="position: absolute; top: 0; left: 0; width: 78%; height: 82%; border-radius: 32px; overflow: hidden; background: #CFEAEA">
<img src="assets/img/sup-duo-pastel.webp" alt="دو نفر در حال پدل‌بورد روی دریای آرام" style="width: 100%; height: 100%; object-fit: cover; display: block">
</div>
<div class="s-zoom" style="position: absolute; bottom: 0; right: 0; width: 44%; height: 56%; border-radius: 28px; overflow: hidden; border: 8px solid #EAF7F6; background: #CFEAEA">
<img src="assets/img/fac-board-nose.webp" alt="نوک برد پدل‌بورد روی آب شفاف" style="width: 100%; height: 100%; object-fit: cover; display: block">
</div>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 28px">
<h3 style="margin: 0; font-size: clamp(26px, 2.6vw, 36px); font-weight: 900">تجربه‌ات را انتخاب کن</h3>
<span style="font-size: 15px; color: #3E5560">همه‌ی سانس‌ها با جلیقه‌ی نجات و حضور ناجی</span>
</div>
<div class="s-exp" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{exps}}" as="e" hint-placeholder-count="4">
<button type="button" class="s-card" onClick="{{e.pick}}" aria-pressed="{{e.on}}" style="{{e.style}}">
<span class="s-zoom" style="display: block; height: 200px; border-radius: 18px; overflow: hidden; background: #CFEAEA"><img src="{{e.img}}" alt="{{e.alt}}" style="width: 100%; height: 100%; object-fit: cover; display: block"></span>
<span style="display: flex; flex-direction: column; gap: 8px; padding: 16px 6px 6px; text-align: right">
<span style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><span style="font-size: 18px; font-weight: 900; color: #0F1E26">{{e.title}}</span><span style="{{e.check}}">{{e.badge}}</span></span>
<span style="font-size: 14px; line-height: 1.85; color: #4A5A63">{{e.desc}}</span>
<span style="font-size: 13px; font-weight: 700; color: #0B7F7B">{{e.meta}}</span>
</span>
</button>

<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#0B5D74","options":["#0B5D74","#1E4D8C","#1F5E45"]},"$preview":{"width":1440,"height":7400}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sport: 'tennis', day: 0, sel: null, exp: 0, supSel: null };
  }
  renderVals() {
    const brand = this.props.brand ?? '#0B5D74';
    const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
    const s = this.state;
    const isTennis = s.sport === 'tennis';
    const isSup = !isTennis;
    const tab = (on, color) => 'flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; height: 44px; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer; ' + (on ? 'background: #FFFFFF; color: ' + color + '; box-shadow: 0 6px 16px -8px rgba(15,30,38,0.35);' : 'background: transparent; color: #5B6A73;');
    const pill = (on, color) => 'border: 0; border-radius: 999px; height: 44px; padding: 0 22px; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer; ' + (on ? 'background: ' + color + '; color: #FFFFFF;' : 'background: transparent; color: #44535C;');
    const setSport = (sp) => () => this.setState({ sport: sp, sel: null, supSel: null });
    const dayNames = ['امروز', 'شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه'];
    const days = dayNames.map((name, i) => {
      const on = s.day === i;
      return {
        name, num: fa(10 + i), on,
        style: 'border: 0; border-radius: 18px; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 0; ' + (on ? 'background: ' + brand + '; color: #FFFFFF;' : 'background: #FFFFFF; color: #2C3B44;'),
        pick: () => this.setState({ day: i, sel: null, supSel: null })
      };
    });
    const hourNums = [16, 17, 18, 19, 20, 21, 22, 23];
    const hours = hourNums.map((h) => ({ t: fa(h) + ':۰۰' }));
    const courts = [{ name: 'رسی ۱', meta: 'زمین رسی' }, { name: 'رسی ۲', meta: 'زمین رسی' }, { name: 'هارد ۱', meta: 'زمین هارد' }];
    let selText = isTennis ? 'یک سانس آزاد را از جدول انتخاب کنید' : 'تجربه و سانس پدل‌بورد را انتخاب کنید';
    const rows = courts.map((c, r) => ({
      name: c.name, meta: c.meta,
      cells: hourNums.map((h, ci) => {
        const key = r + '-' + ci;
        const booked = ((r * 3 + ci * 5 + s.day * 2) % 7) < 3;
        const on = s.sel === key;
        if (on) selText = 'تنیس · زمین ' + c.name + ' · ' + days[s.day].name + ' ' + fa(10 + s.day) + ' مهر · ' + fa(h) + ':۰۰';
        return {
          booked, on,
          label: booked ? 'پر' : (on ? 'انتخاب شد' : 'آزاد'),
          aria: 'زمین ' + c.name + ' ساعت ' + fa(h) + (booked ? ' پر' : ' آزاد'),
          style: 'width: 100%; height: 52px; border: 0; border-radius: 14px; font-family: inherit; font-size: 13px; font-weight: 800; ' + (booked
            ? 'background: #F2F4F5; color: #A3AEB4; cursor: not-allowed;'
            : on ? 'background: ' + brand + '; color: #FFFFFF; cursor: pointer;' : 'background: #E6F6F5; color: #0B6E6B; cursor: pointer;'),
          pick: () => this.setState({ sel: on ? null : key })
        };
      })
    }));
    const expData = [
      { title: 'اجاره‌ی برد', desc: 'برد، پارو و جلیقه‌ی نجات؛ برای کسانی که پاروزدن را بلدند.', meta: '[قیمت] تومان / ساعت', img: 'assets/img/sup-board-closeup.webp', alt: 'برد و پاروی پدل‌بورد' },
      { title: 'کلاس مقدماتی', desc: 'ایستادن، تعادل و پاروزدن درست در جلسه‌ی اول، کنار مربی.', meta: '۹۰ دقیقه · با مربی', img: 'assets/img/sup-kid-lesson.webp', alt: 'کودک با جلیقه‌ی نجات روی پدل‌بورد' },
      { title: 'تور غروب', desc: 'پاروزنی گروهی همراه راهنما در ساعت طلایی و آب آرام.', meta: 'گروهی · با راهنما', img: 'assets/img/sup-sunset-group.webp', alt: 'گروه پدل‌بورد در غروب' },
      { title: 'گروهی و خانوادگی', desc: 'برای دوستان، خانواده و تیم‌های کاری؛ با برنامه‌ی اختصاصی.', meta: 'از [حداقل نفرات] نفر', img: 'assets/img/sup-group-aerial.webp', alt: 'چند پدل‌بورد روی آب فیروزه‌ای' }
    ];
    const exps = expData.map((e, i) => {
      const on = s.exp === i;
      return Object.assign({}, e, {
        on,
        badge: on ? 'انتخاب شد' : '',
        check: on ? 'background: #12A4A0; color: #FFFFFF; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 999px;' : 'display: none;',
        style: 'text-align: right; font-family: inherit; cursor: pointer; padding: 10px; border-radius: 26px; display: flex; flex-direction: column; ' + (on ? 'background: #FFFFFF; border: 2px solid #12A4A0;' : 'background: #FFFFFF; border: 2px solid transparent;'),
        pick: () => this.setState({ exp: i, sport: 'sup', supSel: null })
      });
    });
    const expChips = expData.map((e, i) => {
      const on = s.exp === i;
      return { title: e.title, on, style: 'border: 0; border-radius: 999px; height: 42px; padding: 0 18px; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer; ' + (on ? 'background: #12A4A0; color: #FFFFFF;' : 'background: #FFFFFF; color: #2C3B44;'), pick: () => this.setState({ exp: i, supSel: null }) };
    });
    const slotData = [
      { name: 'طلوع', time: '۰۶:۰۰', note: 'آب صاف و خلوت؛ بهترین زمان برای شروع' },
      { name: 'صبح', time: '۰۸:۰۰', note: 'هوای خنک و نور ملایم' },
      { name: 'عصر', time: '۱۶:۳۰', note: 'مناسب کلاس و تمرین' },
      { name: 'غروب', time: '۱۸:۰۰', note: 'تور ساعت طلایی' }
    ];
    const supSlots = slotData.map((d, i) => {
      const left = (i * 3 + s.day * 2 + s.exp + 1) % 6;
      const full = left === 0;
      const on = s.supSel === i && !full;
      if (on && isSup) selText = 'پدل‌بورد · ' + expData[s.exp].title + ' · ' + days[s.day].name + ' ' + fa(10 + s.day) + ' مهر · ' + d.name + ' ' + d.time;
      return {
        name: d.name, time: d.time, note: d.note, full, on,
        cap: full ? 'تکمیل' : fa(left) + ' برد خالی',
        capStyle: 'font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; ' + (full ? 'background: #F2F4F5; color: #8A969C;' : on ? 'background: rgba(255,255,255,0.2); color: #FFFFFF;' : 'background: #E6F6F5; color: #0B6E6B;'),
        style: 'text-align: right; font-family: inherit; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 6px; border: 0; ' + (full ? 'background: #FFFFFF; color: #A3AEB4; cursor: not-allowed;' : on ? 'background: #0B6E6B; color: #FFFFFF; cursor: pointer;' : 'background: #FFFFFF; color: #0F1E26; cursor: pointer;'),
        pick: () => this.setState({ supSel: i })
      };
    });
    const noSel = isTennis ? !s.sel : (s.supSel === null);
    const firstLeft = (3 * 3 + s.day * 2 + s.exp + 1) % 6;
    return {
      brand, isTennis, isSup,
      tabTennis: tab(isTennis, '#B94A17'), tabSup: tab(isSup, '#0B6E6B'),
      pillTennis: pill(isTennis, brand), pillSup: pill(isSup, '#0B6E6B'),
      setTennis: setSport('tennis'), setSup: setSport('sup'),
      f2Label: isTennis ? 'ساعت' : 'زمان',
      f2Val: isTennis ? '۱۸:۰۰ · ۹۰ دقیقه' : 'غروب · ۱۸:۰۰',
      f3Label: isTennis ? 'نوع زمین' : 'تجربه',
      f3Val: isTennis ? 'رسی' : expData[s.exp].title,
      supLeft: fa(firstLeft === 0 ? 4 : firstLeft),
      bookTitle: isTennis ? 'زمین‌های تنیس خالی' : 'سانس‌های پدل‌بورد',
      days, hours, rows, exps, expChips, supSlots,
      selText, noSel,
      payBtn: 'display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 800; font-size: 15px; padding: 0 26px; height: 52px; border-radius: 999px; ' + (noSel ? 'background: #E3E9EC; color: #7E8A90; pointer-events: none;' : 'background: ' + brand + '; color: #FFFFFF;')
    };
