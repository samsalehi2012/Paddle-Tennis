<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#0B5D74","options":["#0B5D74","#1E4D8C","#1F5E45"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sport: 'tennis', slot: 0 };
  }
  renderVals() {
    const brand = this.props.brand ?? '#0B5D74';
    const s = this.state;
    const isTennis = s.sport === 'tennis';
    const tab = (on, color) => 'flex: 1; border: 0; border-radius: 12px; height: 42px; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer; ' + (on ? 'background: #FFFFFF; color: ' + color + '; box-shadow: 0 6px 16px -8px rgba(15,30,38,0.35);' : 'background: transparent; color: #5B6A73;');
    const raw = isTennis
      ? [['۱۸:۰۰', 'رسی ۲'], ['۱۹:۰۰', 'هارد ۱'], ['۲۰:۳۰', 'رسی ۱'], ['۲۲:۰۰', 'هارد ۱']]
      : [['۰۶:۰۰', 'طلوع'], ['۰۸:۰۰', 'صبح'], ['۱۶:۳۰', 'عصر'], ['۱۸:۰۰', 'غروب']];
    const onBg = isTennis ? brand : '#0B6E6B';
    const slots = raw.map(([time, sub], i) => {
      const on = s.slot === i;
      return {
        time, sub, on,
        style: 'flex: 0 0 auto; width: 92px; height: 70px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: inherit; cursor: pointer; border: 0; ' + (on ? 'background: ' + onBg + '; color: #FFFFFF;' : 'background: #F2F5F6; color: #0F1E26;'),
        pick: () => this.setState({ slot: i })
      };
    });
    const cur = raw[s.slot] || raw[0];
    return {
      brand, isTennis, isSup: !isTennis,
      tabTennis: tab(isTennis, '#B94A17'), tabSup: tab(!isTennis, '#0B6E6B'),
      setTennis: () => this.setState({ sport: 'tennis', slot: 0 }),
      setSup: () => this.setState({ sport: 'sup', slot: 0 }),
      slotTitle: isTennis ? 'زمین‌های خالی امروز' : 'سانس‌های پدل‌بورد امروز',
      slots,
      ctaText: isTennis ? 'رزرو تنیس · ' + cur[1] + ' · ' + cur[0] : 'رزرو پدل‌بورد · ' + cur[1] + ' ' + cur[0]
    };
  }
}
</script>
