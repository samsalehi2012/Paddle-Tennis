<noscript><p style="padding:24px;font-family:Vazirmatn,sans-serif">برای دیدن این صفحه، جاوااسکریپت مرورگر را فعال کنید.</p></noscript>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#0B5D74","options":["#0B5D74","#1E4D8C","#1F5E45"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { notif: true, remind: true, water: true };
  }
  renderVals() {
    const brand = this.props.brand ?? '#0B5D74';
    const s = this.state;
    const track = (on) => 'position: relative; flex: 0 0 auto; width: 52px; height: 32px; border-radius: 999px; border: 0; padding: 0; cursor: pointer; transition: background-color .15s ease; background: ' + (on ? '#12A4A0' : '#D5DEE2') + ';';
    const knob = (on) => 'position: absolute; top: 4px; ' + (on ? 'left: 4px;' : 'left: 24px;') + ' width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 6px rgba(15,30,38,0.25); transition: left .15s ease;';
    return {
      brand,
      notif: s.notif, remind: s.remind, water: s.water,
      notifTrack: track(s.notif), notifKnob: knob(s.notif),
      remindTrack: track(s.remind), remindKnob: knob(s.remind),
      waterTrack: track(s.water), waterKnob: knob(s.water),
      remindNote: s.remind ? '۲ ساعت قبل از هر سانس' : 'خاموش',
      toggleNotif: () => this.setState({ notif: !s.notif }),
      toggleRemind: () => this.setState({ remind: !s.remind }),
      toggleWater: () => this.setState({ water: !s.water })
    };
  }
}
</script>
